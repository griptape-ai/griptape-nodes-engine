  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Documentation for the Griptape Nodes engine: scripting (retained mode),
        the project system, custom node development, and the engine MCP surface. Node and library docs ship with each
        library, not on this site: see the libraries index for links to each
        library's docs, or, with an engine running, use the documentation
        requests described in the for-agents page. Use these files to ground an
        agent in the engine's actual API rather than scraping rendered HTML or
        fetching unrenderered raw markdown from `main`.
      sections:
        Get started:
          - index.md: Top-level introduction to Griptape Nodes
          - installation.md: Install Griptape Nodes via the Desktop app (recommended), a manual engine install, or license activation
          - uninstalling.md: Fully remove Griptape Nodes — the Desktop app uninstaller, `gtn self uninstall`, and the workspace, caches, and model downloads left behind
          - architecture.md: Deployment architecture for the Griptape Cloud and on-premises models — components, trust boundaries, and what leaves your network
          - faq.md: Frequently asked questions
          - troubleshooting.md: Fixes for commonly encountered issues and states
          - glossary.md: Terms and definitions used throughout the docs
          - for_agents.md: Hosted machine-readable docs surface (this page)
        Tutorials:
          - tutorials/index.md: Tutorial overview
          - tutorials/00_tour/index.md
          - tutorials/01_prompt_an_image/index.md
          - tutorials/02_coordinating_agents/index.md
          - tutorials/03_compare_prompts/index.md
          - tutorials/04_photography_team/index.md
        Desktop App:
          - guides/desktop/app_settings.md: Griptape Nodes Desktop App Settings — workspace, license, logs, update behavior, and the Stable/Nightly release channels
          - guides/desktop/environment_variables.md: Desktop launch environment variables for licenses, updates, server endpoints, and HTTPS routing
        Editor:
          - guides/editor/index.md: Orientation tour of the visual editor (canvas, header, menus, sidebars)
          - guides/editor/keyboard_shortcuts.md: Complete keyboard shortcut reference
          - guides/editor/working_with_nodes.md: Adding, selecting, wiring, and editing nodes on the canvas
          - guides/editor/node_groups.md: Groups, subflows, and iterative group types (ForEach, For Loop, Retry)
          - guides/editor/running_workflows.md: Running, stopping, logs, error history, and saving
          - guides/editor/undo_and_redo.md: Taking back and putting back changes to a workflow
          - guides/editor/media_editors.md: Built-in viewers and editors for images, video, audio, 3D, and splats
          - guides/editor/managing_models_and_libraries.md: Model Management and Library Management windows
          - guides/editor/beta_features.md: Turning experimental beta features on and off
        Agent:
          - guides/agent/index.md: Built-in AI assistant with direct workflow access via the Griptape MCP server
          - guides/agent/threads.md: Conversation threads and local storage locations
          - guides/agent/approvals.md: Approving workflow runs, image generation, and MCP tools before the agent uses them
          - guides/agent/using_in_workflows.md: Using the Agent node in workflows
          - guides/agent/personalization.md: Customizing agent tone, role, and system prompt
          - guides/agent/skills.md: Extending the agent with custom skill files
          - guides/agent/mcp_servers.md: Attaching MCP servers to an agent conversation
          - guides/agent/providers/index.md: Overview of supported AI providers
          - guides/agent/providers/griptape_cloud.md: Griptape Cloud (default hosted provider)
          - guides/agent/providers/ollama.md: Ollama local provider setup
          - guides/agent/providers/lm_studio.md: LM Studio local provider setup
          - guides/agent/providers/custom.md: Custom OpenAI-compatible endpoint setup
        Configuration and libraries:
          - guides/configuration.md: Engine configuration (workspace, secrets, libraries)
          - guides/local_editor.md: Serving the editor from the engine at 127.0.0.1:8126 instead of using the hosted editor
          - guides/libraries.md: Installing and managing node libraries
          - guides/managed_environment.md: Running the engine inside an environment a studio's own tools prepare (library paths, provisioned by, worker command prefix)
          - guides/run_nodes_on_another_computer.md: Running a library's nodes on another computer's engine (distributed_execution.libraries, advertise_url, requirements, troubleshooting)
        Project system:
          - guides/projects/index.md: Project system overview
          - guides/projects/gui_guide.md: Managing projects from the GUI
          - guides/projects/workspace.md: Workspace concepts
          - guides/projects/projects.md: Projects
          - guides/projects/directories.md: Directories
          - guides/projects/macros.md: Macros
          - guides/projects/situations.md: Situations
          - guides/projects/environment.md: Environment and built-in variables
          - guides/projects/variables.md: Project variables
          - guides/projects/file_extension_directories.md: File extension directories
          - guides/projects/sequences.md: Numbered file sequences (patterns and policies)
          - guides/projects/version_pinning.md: Pinning engine and library versions
          - guides/projects/customization.md: Customization guide
        Workflows:
          - guides/variables.md: Workflow variables — scopes, variable nodes, and inline {name} substitution
          - guides/assets.md: Where generated files go, previews and downloads, and uploads
          - guides/workflow_versions.md: Save As New Version and versioned workflow files
          - guides/publishing.md: Publishing a workflow — lifecycle, dependency bundling, and static-file workarounds
        MCP integration:
          - guides/mcp/index.md: MCP integration overview
          - guides/mcp/getting_started.md
          - guides/mcp/connection_types/stdio.md
          - guides/mcp/connection_types/sse.md
          - guides/mcp/connection_types/streamable_http.md
          - guides/mcp/connection_types/websocket.md
          - guides/mcp/mcp_task_agents.md
          - guides/mcp/advanced_local_models.md
          - guides/mcp/external_clients.md
          - guides/mcp/rules.md
          - guides/mcp/servers/index.md
          - guides/mcp/servers/blender.md
          - guides/mcp/servers/exa.md
          - guides/mcp/servers/fetch.md
          - guides/mcp/servers/filesystem.md
          - guides/mcp/servers/maya.md
          - guides/mcp/servers/time.md
        External services:
          - guides/integrations/openai.md
          - guides/integrations/grok.md
          - guides/integrations/hugging_face.md
        Scripting (retained mode):
          - development/retained_mode.md: Engine scripting API for building and running workflows
        Custom nodes:
          - development/custom_nodes/index.md: Developing custom nodes overview
          - development/custom_nodes/getting_started.md: Beginner-friendly intro to node development
          - development/custom_nodes/parameters.md: Parameter attributes, traits, helper classes, containers, and advanced parameter patterns
          - development/custom_nodes/parameter_ui_reference.md: Parameter type to widget mapping, supported ui_options keys, and traits
          - development/custom_nodes/execution_and_lifecycle.md: Lifecycle callbacks and asynchronous API integration patterns
          - development/custom_nodes/project_system.md: Saving files from nodes through the project system (situations, macros, ProjectFileParameter)
          - development/custom_nodes/direct_provider_budgets.md: Checking Griptape Cloud budgets before a direct provider call and reporting its cost after
          - development/custom_nodes/error_handling.md: Best practices for secrets, imports, parameter payload size, validation, error handling, and logging
          - development/custom_nodes/authoring_libraries.md: Library manifests, declarations, dependency management, and contributing to the standard library
          - development/custom_nodes/advanced_libraries.md: AdvancedNodeLibrary lifecycle hooks, library-owned request handlers, post-dispatch hooks, execution and app event listeners, and registering node types without listing them in the manifest
          - development/custom_nodes/library_documentation.md: Shipping docs with a library, the docs folder layout, page names and frontmatter, pages for nodes, templates and MCP tools, and skills for agents
          - development/custom_nodes/custom_widgets.md: Custom JavaScript widget components and the widget testbed
          - development/custom_nodes/examples.md: Advanced patterns from production nodes and quick-reference material
          - development/custom_nodes/node_isolation_with_workers.md: Running a library's node execution in a worker subprocess for dependency isolation
          - development/custom_nodes/passing_unserializable_values.md: Passing pipelines, tensors and other unserializable values between nodes across a worker process boundary
          - development/custom_nodes/strict_mode.md: Strict-mode rules checked while a node executes
        Reference:
          - reference/command_line_interface.md: gtn CLI reference
          - reference/configuration_reference.md: Every engine setting with type, default, and env var
        Enterprise:
          - enterprise/on_premises_quick_start.md: Step-by-step rollout of an on-premises deployment, from Cloud API key to activated workstations
          - enterprise/admin_dashboard.md: Manage license keys, access groups, and permission templates from the editor's admin interface
          - enterprise/cedar_policies.md: Cedar reference for hand-written permission templates - checkpoints, resource attributes, context facts, annotations, examples
          - enterprise/admin_server.md: Run a single in-network proxy so app instances avoid public internet access
          - enterprise/using_the_admin_server.md: Activate the desktop app with a license through the Admin Server
          - enterprise/disabling_app_updates.md: Turn off desktop app updates on a managed machine with a machine-level policy.json file
        Agent skills:
          - skills/griptape-nodes-workflows/SKILL.md: Build, run, and inspect workflows through the engine's MCP server
        Node libraries:
          - libraries/index.md: Overview of node libraries (installed by default and installable)

