                    colour: *half_opacity_red
                    max_absolute_error: *exact_pixel_tolerance
              metadata:
                equals:
                  Orientation: 1
          - format: jpg
            expect:
              dimensions:
                width: 512
                height: 512
              sample_type: uint8
              channels: *rgb_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: [1, 0, 0]
                    max_absolute_error: *three_uint8_levels_with_float_epsilon
              metadata:
                equals:
                  Orientation: 1
          - format: webp
            expect:
              dimensions:
                width: 512
                height: 512
              sample_type: uint8
              channels: *rgba_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: *half_opacity_red
                    max_absolute_error: *three_uint8_levels_with_float_epsilon
              metadata:
