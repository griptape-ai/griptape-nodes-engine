schema_version: 1
images:
  - id: multichannel_5
    source:
      dimensions:
        width: 64
        height: 32
      channels: [R, G, B, A, extra_0]
      pixels:
        pattern: solid
        colour: [1, 0, 0, 0.5019607843137255, 0.25]
      alpha_association: straight
    variants:
      - id: tiff8
        format: tiff
        sample_type: uint8
    cases:
      - id: bounds_16
        operation: generate_thumbnail
        inputs: [tiff8]
        parameters:
          max_width: 16
          max_height: 16
        outputs:
          - format: png
            expect:
              dimensions:
                width: 16
                height: 8
              sample_type: uint8
              channels: &rgba_channels [R, G, B, A]
              pixels:
                checks:
                  - kind: all_pixels
                    colour: [1, 0, 0, 0.5019607843137255]
                    max_absolute_error: &exact_pixel_tolerance 1e-06
          - format: webp
            expect:
              dimensions:
                width: 16
                height: 8
              sample_type: uint8
              channels: *rgba_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: [1, 0, 0, 0.5019607843137255]
                    max_absolute_error: &three_uint8_levels_with_float_epsilon 0.01176480588235294
      - id: bounds_64
        operation: generate_thumbnail
        inputs: [tiff8]
        parameters:
          max_width: 64
          max_height: 64
        outputs:
          - format: png
            expect:
