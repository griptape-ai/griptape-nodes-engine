schema_version: 1
images:
  - id: grayscale
    source:
      dimensions:
        width: 64
        height: 32
      channels: &grayscale_channels [Y]
      pixels:
        pattern: solid
        colour: &grayscale_mid_grey [0.5019607843137255]
    variants:
