        sample_type: uint8
    cases:
      - id: default
        operation: generate_thumbnail
        inputs: [png8]
        parameters: &default_bounds {}
        outputs:
          - format: png
            expect:
              dimensions:
                width: 64
                height: 32
              sample_type: uint8
              channels: *grayscale_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: *grayscale_mid_grey
                    max_absolute_error: &exact_pixel_tolerance 1e-06
              metadata:
                equals:
                  Orientation: 1
          - format: jpg
