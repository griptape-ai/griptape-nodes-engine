schema_version: 1
images:
  # Display-window expectations use literal frame geometry, independent of rendering code.
  # Colours are sRGB primaries to isolate framing from colour conversion. Samples avoid
  # Lanczos boundaries; PNG allows one quantisation level plus float decoding epsilon.
  - id: window_offset_resized
    source:
      dimensions: {width: 64, height: 16}
      data_origin: {x: 32, y: 64}
      display_window: {x: 0, y: 0, width: 128, height: 128}
      channels: [R, G, B]
      metadata: {"oiio:ColorSpace": sRGB}
      pixels:
        pattern: solid
        colour: [1, 0, 0]
    variants:
      - {id: exr_half, format: exr, sample_type: float16}
    cases:
      - id: display_frame
        operation: generate_thumbnail
        inputs: [exr_half]
        parameters: {max_width: 64, max_height: 64}
        outputs:
          - format: png
            expect:
              dimensions: {width: 64, height: 64}
              data_window: {x: 0, y: 0, width: 64, height: 64}
              display_window: {x: 0, y: 0, width: 64, height: 64}
              channels: [R, G, B]
              pixels:
                checks:
                  - kind: sample
                    position: {x: 24, y: 35}
                    colour: [1, 0, 0]
                    max_absolute_error: 0.003921668627450981
                  - kind: sample
                    position: {x: 8, y: 8}
                    colour: [0, 0, 0]
                    max_absolute_error: 0.003921668627450981
                  - kind: sample
                    position: {x: 54, y: 35}
                    colour: [0, 0, 0]
                    max_absolute_error: 0.003921668627450981
                  - kind: sample
                    position: {x: 24, y: 48}
                    colour: [0, 0, 0]
                    max_absolute_error: 0.003921668627450981
