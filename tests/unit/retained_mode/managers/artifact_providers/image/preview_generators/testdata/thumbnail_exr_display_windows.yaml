  - id: window_overscan
    source:
      dimensions: {width: 64, height: 48}
      data_origin: {x: -16, y: -8}
      display_window: {x: 0, y: 0, width: 32, height: 32}
      channels: [R, G, B]
      metadata: {"oiio:ColorSpace": sRGB}
      pixels:
        pattern: quadrants
        colours: [[1, 0, 0], [0, 0, 1], [0, 1, 0], [1, 1, 0]]
    variants:
      - {id: exr_half, format: exr, sample_type: float16}
    cases:
      - id: display_frame
        operation: generate_thumbnail
        inputs: [exr_half]
        parameters: {max_width: 16, max_height: 16}
        outputs:
