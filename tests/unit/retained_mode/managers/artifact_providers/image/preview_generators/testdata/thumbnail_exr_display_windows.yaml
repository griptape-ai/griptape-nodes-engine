              data_window: {x: 0, y: 0, width: 16, height: 16}
              display_window: {x: 0, y: 0, width: 16, height: 16}
              channels: [R, G, B]
              pixels:
                checks:
                  - kind: sample
                    position: {x: 4, y: 4}
                    colour: [1, 0, 0]
                    max_absolute_error: 0.003921668627450981
                  - kind: sample
                    position: {x: 12, y: 4}
                    colour: [0, 0, 1]
                    max_absolute_error: 0.003921668627450981
                  - kind: sample
                    position: {x: 4, y: 12}
                    colour: [0, 1, 0]
                    max_absolute_error: 0.003921668627450981
                  - kind: sample
