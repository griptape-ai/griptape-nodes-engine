              pixels:
                checks:
                  - kind: sample
                    position: {x: 12, y: 12}
                    colour: [1, 0, 0, 1]
                    max_absolute_error: 0.01176480588235294
                  - kind: sample
                    position: {x: 0, y: 0}
                    colour: [0, 0, 0, 0]
                    max_absolute_error: 0.01176480588235294
                  - kind: sample
                    position: {x: 30, y: 30}
                    colour: [0, 0, 0, 0]
                    max_absolute_error: 0.01176480588235294
          - format: jpg
            expect:
              dimensions: {width: 32, height: 32}
              data_window: {x: 0, y: 0, width: 32, height: 32}
              display_window: {x: 0, y: 0, width: 32, height: 32}
              channels: [R, G, B]
              pixels:
                checks:
                  - kind: sample
                    position: {x: 12, y: 12}
                    colour: [1, 0, 0]
                    max_absolute_error: 0.01176480588235294
                  - kind: sample
                    position: {x: 0, y: 0}
                    # Independent Pillow probe: RGB black 32x32 with red rectangle
                    # (8,8)-(24,16), JPEG quality=75, subsampling=2, progressive=False.
                    # Lossy ringing gives (8,0,12); quality 98 previously hid it.
                    colour: [0.03137254901960784, 0, 0.047058823529411764]
                    max_absolute_error: 0.01176480588235294
                  - kind: sample
                    position: {x: 30, y: 30}
                    colour: [0, 0, 0]
                    max_absolute_error: 0.01176480588235294
