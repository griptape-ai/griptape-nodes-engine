# Declarative thumbnail tests: procedural inputs and expected encoded outputs.
# Pydantic validates this file using ../image_fixtures/image_specifications.py.
# Unknown fields are rejected. Optional fields can be omitted; unlisted expectations
# are unchecked. &name defines a reusable YAML value; *name references that value.
#
# Example (copy without the leading '# '):
# schema_version: 1                     # Required schema version.
# images:
#   - id: translucent_red               # Unique image id: letters, digits, '_' and '-'.
#     description: Check alpha resizing # Optional explanation of the behaviour.
#     source:
#       dimensions: {width: 64, height: 32} # Positive data-window dimensions in pixels.
#       data_origin: {x: -8, y: 4}     # EXR only; signed origin, default zero.
#       display_window: {x: 0, y: 0, width: 128, height: 64} # EXR; defaults to data window.
#       channels: [R, G, B, A]           # Ordered, unique names; also supports Y and extras.
#       colour_space: srgb              # Optional intent only; does not write a colour tag.
#       alpha_association: straight     # Optional: straight or premultiplied; requires A.
#       metadata:                       # Optional encoded attributes: string/int/float values.
#         gtn_workflow_name: test_workflow
#       pixels:
#         pattern: solid                # Pattern-specific fields are listed below.
#         colour: [1, 0, 0, 0.5]         # One value per channel; integer sources use [0, 1].
#     variants:
#       - id: png8                      # Unique input variant id within this image.
#         format: png                   # Input format; allowed depths are listed below.
#         sample_type: uint8            # Stored sample type, verified after encoding.
#         metadata: {artist_note: keep} # Optional additions/overrides to source metadata.
#         encoding: {CompressionLevel: 6} # Optional format-specific OIIO writer attributes.
#         expect:                       # Optional read-back checks on the generated input.
#           metadata:
#             equals: {gtn_workflow_name: test_workflow}
#     cases:
#       - id: resize                    # Unique case id within this image.
#         operation: generate_thumbnail # Currently the only operation.
#         inputs: [png8]                # Nonempty list of declared variant ids to test.
#         parameters:                   # Optional; each bound defaults to 1024.
#           max_width: 16               # Integer from 1 to 8192.
#           max_height: 16              # Integer from 1 to 8192.
#         inject_metadata: false        # Optional; enable engine publication metadata.
#         preserve_source_metadata: false # Optional; retain PNG source text in PNG output.
#         workflow_name: test_workflow  # Optional bound workflow; see metadata case below.
#         outputs:
#           - format: png               # Output: png, jpg, jpeg or webp.
#             expect:                   # Required; at least one assertion. Also used above.
#               dimensions: {width: 16, height: 8} # Optional literal expected dimensions.
#               sample_type: uint8      # Optional expected stored depth/type.
#               channels: [R, G, B, A]   # Optional ordered decoded channel names.
#               metadata:               # Optional checks; equality includes value type.
#                 equals: {gtn_workflow_name: test_workflow}
#                 present: [artist_note] # Keys that must exist, regardless of value.
#                 absent: [source_capture_id] # Keys that must be missing.
#               pixels:
#                 checks:               # Nonempty list; every check is evaluated.
#                   - kind: all_pixels   # all_pixels, sample or region; see examples below.
#                     colour: [1, 0, 0, 0.5] # Expected values in decoded channel order.
#                     max_absolute_error: 0.003921668627450981 # Required finite tolerance >= 0.
#
# Alternative source pixel patterns (use one mapping under source.pixels):
#   {pattern: gradient, axis: x, start: [0, 0, 0], end: [1, 1, 1]}
#     axis: x or y; start/end are colours at the first/last pixel along that axis.
#   {pattern: colour_bars, axis: x, colours: [[1, 0, 0], [0, 0, 1]]}
#     Equal bands along x or y; one or more colours, in spatial order.
#   {pattern: checkerboard, cell_dimensions: {width: 8, height: 8},
#    colours: [[0, 0, 0], [1, 1, 1]]}
#     Positive cell dimensions and exactly two alternating colours, first at top-left.
#   {pattern: quadrants, colours: [[1, 0, 0], [0, 0, 1], [0, 1, 0], [1, 1, 0]]}
#     Exactly four colours: top-left, top-right, bottom-left, bottom-right.
# Floating-point sources allow HDR values outside [0, 1]. Every colour matches channels.
# Integer source values use round-half-up quantisation. For odd quadrant dimensions,
# the right/bottom halves receive the extra pixel. Colour bars select the band with
# floor(coordinate * colour_count / axis_length).
# Pixel checks read straight alpha for PNG/TIFF. EXR can model premultiplied values.
# Decoded grayscale channel R is normalized to the declared Y for comparisons.
#
# Alternative pixel checks (colour and max_absolute_error remain required):
#   {kind: sample, position: {x: 4, y: 2}, colour: [1, 0, 0], max_absolute_error: 0}
#   {kind: region, region: {x: 0, y: 0, width: 4, height: 2},
#    colour: [1, 0, 0], max_absolute_error: 0}
# Coordinates are zero-based from the stored data window's top-left, regardless of origin.
# Region width/height must be positive. expect.data_window and expect.display_window accept
# {x, y, width, height} to check native signed origins and positive dimensions.
#
# Input format/sample_type combinations:
#   png: uint1/uint8/uint16; jpg/jpeg/webp: uint8; tiff/tif: uint8/uint16/float32;
#   exr: float16/float32; hdr: float32; dpx: uint8/uint16.
# Channel restrictions: JPEG uses Y or RGB; WebP uses RGB/RGBA; HDR/DPX use RGB;
# PNG supports 1-4 channels. uint1 requires solid grayscale. TIFF/EXR support extras.
#
# Optional expect.encoding checks apply to JPEG outputs (distinct from variant.encoding):
#   quantization: {0: [64 brightness entries], 1: [64 colour entries]} # Exact JPEG tables.
#   sampling: 2                         # Pillow sampling code: 0=4:4:4, 1=4:2:2, 2=4:2:0.
#   progressive: false                  # Whether progressive JPEG encoding is expected.
# Use *jpeg_quality_75_encoding below to reuse the existing complete expectation.
#
# To add a test:
# 1. Define/reuse an image and encoded variant; keep expectations close to the source.
# 2. Add a case selecting input ids, bounds, output formats and explicit expected results.
# 3. Justify pixel values/tolerances independently of the production thumbnail generator.
# 4. Run ../test_openimageio_thumbnail_contracts.py with pytest -k 'image/variant/case/format'.
# Inputs are generated lazily once per worker in pytest temporary directories.
# Collection generates no files. Stored dimensions, depth and channel count are verified.
# Failure injection, logging and internal call-order assertions remain in Python.
# Provenance and coverage changes are documented beside the relevant cases below.
schema_version: 1
images:
  # Bounds/aspect-ratio dimensions were transcribed from EXPECTED_THUMBNAIL_SIZES
  # at ff53552f2. Literal expectations cover default, square, narrow, wide and
  # no-upscaling bounds, including the rounded 341 x 256 colour-bars output.
  - id: square
    source:
      dimensions:
        width: 2048
        height: 2048
      channels: &rgb_channels [R, G, B]
      pixels:
        pattern: solid
        colour: &square_red [1, 0, 0]
    variants:
      - id: png8
        format: png
        sample_type: uint8
      - id: jpeg8
        format: jpg
        sample_type: uint8
      - id: webp8
        format: webp
        sample_type: uint8
    cases:
      - id: default
        operation: generate_thumbnail
        inputs: [png8]
        parameters: &default_bounds {}
        outputs:
          - format: png
            expect:
              dimensions:
                width: 1024
                height: 1024
              sample_type: uint8
              channels: *rgb_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: *square_red
                    # Retains the previous solid-PNG comparison tolerance.
                    max_absolute_error: &exact_pixel_tolerance 1e-06
              metadata:
                equals:
                  Orientation: 1
          - format: jpg
            expect:
              dimensions:
                width: 1024
                height: 1024
              sample_type: uint8
              channels: *rgb_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: *square_red
                    # Lossy outputs allow 3/255 plus 1e-7 float32 decoding epsilon.
                    # Decoded 3/255 can exceed its Python float value by about 1e-9.
                    max_absolute_error: &three_uint8_levels_with_float_epsilon 0.01176480588235294
              metadata:
                equals:
                  Orientation: 1
              # Extracted from baseline_square.jpg at ff53552f2 before its removal.
              # The baseline was read unchanged; it was never regenerated.
              encoding: &jpeg_quality_75_encoding
                quantization:
                  0: [8, 6, 5, 8, 12, 20, 26, 31, 6, 6, 7, 10, 13, 29, 30, 28, 7, 7, 8, 12, 20, 29, 35, 28, 7,
                        9, 11, 15, 26, 44, 40, 31, 9, 11, 19, 28, 34, 55, 52, 39, 12, 18, 28, 32, 41, 52, 57,
                        46, 25, 32, 39, 44, 52, 61, 60, 51, 36, 46, 48, 49, 56, 50, 52, 50]
                  1: [9, 9, 12, 24, 50, 50, 50, 50, 9, 11, 13, 33, 50, 50, 50, 50, 12, 13, 28, 50, 50, 50, 50,
                        50, 24, 33, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50,
                    50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50, 50]
                sampling: 2
                progressive: false
          - format: webp
            expect:
              dimensions:
                width: 1024
                height: 1024
              sample_type: uint8
              channels: *rgb_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: *square_red
                    max_absolute_error: *three_uint8_levels_with_float_epsilon
              metadata:
                absent: [Orientation]
      # Independently encoded uniform JPEG red decodes as [254/255, 0, 0].
      # PNG outputs assert that input colour with the original exact tolerance.
      - id: default_jpeg8
        operation: generate_thumbnail
        inputs: [jpeg8]
        parameters: {}
        outputs:
          - format: png
            expect:
              dimensions:
                width: 1024
                height: 1024
              sample_type: uint8
              channels: &square_jpeg_default_rgb_channels [R, G, B]
              pixels:
                checks:
                  - kind: all_pixels
                    colour: [0.996078431372549, 0, 0]
                    max_absolute_error: *exact_pixel_tolerance
              metadata:
                equals:
                  Orientation: 1
          - format: jpg
            expect:
              dimensions:
                width: 1024
                height: 1024
              sample_type: uint8
              channels: *square_jpeg_default_rgb_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: &square_jpeg_default_red [1, 0, 0]
                    max_absolute_error: *three_uint8_levels_with_float_epsilon
              metadata:
                equals:
                  Orientation: 1
              encoding: *jpeg_quality_75_encoding
          - format: webp
            expect:
              dimensions:
                width: 1024
                height: 1024
              sample_type: uint8
              channels: *square_jpeg_default_rgb_channels
              pixels:
                checks:
                  - kind: all_pixels
                    colour: *square_jpeg_default_red
                    max_absolute_error: *three_uint8_levels_with_float_epsilon
              metadata:
                absent: [Orientation]
