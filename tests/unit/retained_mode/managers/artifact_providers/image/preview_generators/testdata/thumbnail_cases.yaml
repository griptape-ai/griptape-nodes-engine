  # Independently probed OIIO metadata outcomes: PNG preserves custom strings
  # and discards the tested custom numeric attributes. JPEG/WebP discard these
  # custom text keys. Read-back expectations make each outcome explicit.
  # Publication injection is off by default. With injection enabled, the runner
  # registers the image provider and opens a workflow with a fixed test ID.
  # Its registry name, unsaved:00000000000000000000000000000000, replaces the
  # source workflow key. Unrelated text survives and gtn_saved_at is added.
  # Automatic workflow metadata injection currently applies only to PNG.
  - id: metadata
    source:
      dimensions:
        width: 64
        height: 32
      channels: *rgb_channels
      pixels:
        pattern: solid
        colour: [1, 0, 0]
      metadata:
        gtn_workflow_name: test_workflow
        artist_note: keep_me
        custom_integer: 7
        custom_float: 0.25
    variants:
      - id: png8
        format: png
        sample_type: uint8
        expect:
          metadata:
            equals:
              gtn_workflow_name: test_workflow
              artist_note: keep_me
            absent: [custom_integer, custom_float]
    cases:
      - id: default_discards_text
        operation: generate_thumbnail
        inputs: [png8]
        parameters: {max_width: 16, max_height: 16}
        outputs:
          - format: png
            expect:
              dimensions: {width: 16, height: 8}
              metadata:
                absent: [gtn_workflow_name, artist_note]
      - id: pass_through
        preserve_source_metadata: true
        operation: generate_thumbnail
        inputs: [png8]
        parameters:
          max_width: 16
          max_height: 16
        outputs:
          - format: png
            expect:
              dimensions:
                width: 16
                height: 8
              sample_type: uint8
              channels: *rgb_channels
              metadata:
                equals:
                  gtn_workflow_name: test_workflow
                  artist_note: keep_me
          - format: jpg
            expect:
              dimensions:
                width: 16
                height: 8
              sample_type: uint8
              channels: *rgb_channels
              metadata:
                absent: [gtn_workflow_name, artist_note]
          - format: webp
            expect:
              dimensions:
                width: 16
                height: 8
              sample_type: uint8
              channels: *rgb_channels
              metadata:
                absent: [gtn_workflow_name, artist_note]
      - id: publication
        preserve_source_metadata: true
        operation: generate_thumbnail
        inputs: [png8]
        parameters:
          max_width: 16
          max_height: 16
        outputs:
          - format: png
            expect:
              dimensions:
                width: 16
                height: 8
              sample_type: uint8
              channels: *rgb_channels
              metadata:
                equals:
                  gtn_workflow_name: unsaved:00000000000000000000000000000000
                  artist_note: keep_me
                present: [gtn_saved_at]
        workflow_name: current_workflow
        inject_metadata: true
  # Independent resampling expectation: reducing a 64-pixel ramp to 16 maps
  # source_x = (output_x + 0.5) * 4 - 0.5. A normalized symmetric filter
  # reproduces the linear interior: pixels 7/8 are 29.5/63 and 33.5/63,
  # within one UINT16 level. Expected values never use the production resizer.
  - id: gradient
    source:
      dimensions:
        width: 64
        height: 32
      channels: *rgb_channels
      pixels:
        pattern: gradient
        axis: x
        start: [0, 0, 0]
        end: [1, 1, 1]
    variants:
      - id: png16
        format: png
        sample_type: uint16
    cases:
      - id: resampling
        operation: generate_thumbnail
        inputs: [png16]
        parameters:
          max_width: 16
          max_height: 16
        outputs:
          - format: png
            expect:
              dimensions:
                width: 16
                height: 8
              sample_type: uint16
              channels: *rgb_channels
              pixels:
                checks:
                  - kind: sample
                    colour: [0.46825396825396826, 0.46825396825396826, 0.46825396825396826]
                    max_absolute_error: *one_uint16_level
                    position:
                      x: 7
                      y: 4
                  - kind: sample
                    colour: [0.5317460317460317, 0.5317460317460317, 0.5317460317460317]
                    max_absolute_error: *one_uint16_level
                    position:
                      x: 8
                      y: 4
  # A balanced one-pixel checkerboard reduced by eight averages to 0.5 away
  # from edges. Check its interior within one UINT8 level. This and the ramp
  # replace Pillow noise equivalence with explicit resampling properties.
  - id: checkerboard
    source:
      dimensions:
        width: 128
        height: 128
      channels: [Y]
