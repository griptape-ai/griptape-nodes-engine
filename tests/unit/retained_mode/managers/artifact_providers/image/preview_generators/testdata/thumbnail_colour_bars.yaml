schema_version: 1
images:
  # Spatial checks sample band interiors away from filtering transitions.
  # Transition pixels and other rows no longer receive full-image Pillow comparisons.
  - id: color_bars
    source:
      dimensions:
        width: 2048
        height: 1536
      channels: &rgb_channels [R, G, B]
      pixels:
        pattern: colour_bars
        axis: x
        colours:
          - &colour_bar_black [0, 0, 0]
          - &colour_bar_white [1, 1, 1]
          - &colour_bar_red [1, 0, 0]
          - &colour_bar_green [0, 1, 0]
          - &colour_bar_blue [0, 0, 1]
          - &colour_bar_cyan [0, 1, 1]
          - &colour_bar_magenta [1, 0, 1]
          - &colour_bar_yellow [1, 1, 0]
    variants:
      - id: png8
        format: png
        sample_type: uint8
    cases:
      - id: default
        operation: generate_thumbnail
        inputs: [png8]
        parameters: {}
        outputs:
          - format: png
            expect:
              dimensions:
                width: 1024
                height: 768
              sample_type: uint8
              channels: *rgb_channels
              pixels:
                checks:
                  - kind: sample
                    colour: *colour_bar_black
                    max_absolute_error: &exact_pixel_tolerance 1e-06
                    position:
                      x: 64
                      y: 384
                  - kind: sample
                    colour: *colour_bar_white
                    max_absolute_error: *exact_pixel_tolerance
                    position:
                      x: 192
                      y: 384
