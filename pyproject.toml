[project]
name = "griptape-nodes-engine"
version = "0.98.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.0, <3.14"
dependencies = [
  "griptape>=1.10.2",
  "pydantic>=2.10.6",
  "python-dotenv>=1.0.1",
  "xdg-base-dirs>=6.0.2",
  "httpx>=0.28.0,<1.0.0",
  "websockets>=15.0.1,<18.0.0",
  "tomlkit>=0.13.2",
  # TODO: https://github.com/griptape-ai/griptape-nodes-engine/issues/833
  "uv>=0.6.16",
  "fastapi>=0.115.12",
  "uvicorn>=0.34.2",
  "packaging>=25.0",
  "python-multipart>=0.0.20",
  "json-repair>=0.46.1",
  # servers/mcp.py targets the 1.x low-level server API. Migrating is not just a rewrite:
  # pydantic-ai-slim reaches mcp through fastmcp-slim[client]<4, and every fastmcp-slim release
  # under that cap requires mcp<2.0, so asking for 2.x makes the resolve unsatisfiable.
  # TODO: https://github.com/griptape-ai/griptape-nodes-engine/issues/5218
  "mcp>=1.10.1,<2",
  "binaryornot>=0.4.4",
  "pillow>=11.3.0",
  "static-ffmpeg>=3.0",
  "watchfiles>=1.1.0",
  "typer>=0.15.0",
  "huggingface-hub>=1.9.0",
  "rich>=14.1.0",
  "semver>=3.0.4",
  "anyio>=4.0",
  "ruamel.yaml>=0.18.15",
  "asyncio-thread-runner>=1.0",
  "portalocker>=2.10.0",
  "send2trash>=2.1.0",
  "tenacity>=9.0.0",
  "truststore>=0.10.1",
  "cattrs>=26.1.0",
  "fileseq>=3.2.0",
  "pydantic-ai-slim[mcp,openai]>=1.95.1",
  "pydantic-ai-skills>=0.11.0",
]

[project.optional-dependencies]
profiling = ["austin-dist>=3.7.0"]

[dependency-groups]
dev = [
  "griptape-cloud-client",
  "mdformat>=0.7.22",
  "mdformat-gfm>=0.4.1",
  "mdformat-frontmatter>=2.0.8",
  "mdformat-footnote>=0.1.1",
  "mdformat-mkdocs>=4.1.2",
  "pyright>=1.1.396",
  "ruff>=0.16.0",
  "typos>=1.30.2",
]
docs = [
  "mkdocs-material>=9.6.9",
  "mkdocs>=1.5.2",
  "mkdocstrings[python]>=0.29.1",
  "mkdocs-llmstxt>=0.5.0",
  "mkdocs-redirects>=1.2.2,<1.2.4",
  "pymdown-extensions>=10.17",
]
test = [
  "pytest>=8.3.5",
  "pytest-asyncio>=1.1.0",
  "pytest-mock>=3.14.0",
  "pytest-xdist>=3.6.1",
  "pytest-cov>=6.0.0",
  "pytest-timeout>=2.4.0",
  "coverage>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.7.2,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "griptape_nodes"

[tool.uv.sources]
griptape-cloud-client = { git = "https://github.com/griptape-ai/griptape-cloud-python-client", rev = "main" }

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["libraries/griptape_nodes_library"]

[tool.ruff]
line-length = 120
# Engine-generated workflow files. Their formatting is whatever the workflow generator emits, so
# reformatting them would mean the committed copy no longer matches a real save.
extend-exclude = ["libraries/**/templates/*.py", "tests/e2e/fixtures/**/*_workflow.py"]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "TD002",   # Intentional
  "FIX002",  # Intentional
  "D101",    # Intentional
  "D102",    # Intentional
  "D107",    # Intentional
  "ANN002",  # Intentional
  "ANN003",  # Intentional
  "ANN401",  # Intentional
  "COM812",  # Intentional
  "E501",    # TODO: https://github.com/griptape-ai/griptape-nodes-engine/issues/834
  "D100",    # TODO: https://github.com/griptape-ai/griptape-nodes-engine/issues/835
  "BLE001",  # TODO: https://github.com/griptape-ai/griptape-nodes-engine/issues/839
  "SLF001",  # TODO :https://github.com/griptape-ai/griptape-nodes-engine/issues/838
  "SIM108",  # Intentional
  "SIM110",  # Intentional
  "D105",    # Intentional
  "N802",    # TODO: https://github.com/griptape-ai/griptape-nodes-engine/issues/840
  "TRY400",  # Intentional
  "FBT003",  # Intentional
  "RET504",  # Intentional
  "PLC0415", # Intentional
  "CPY001",  # Intentional
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"nodes.griptape_nodes_library".msg = "Import from griptape_nodes_library instead of nodes.griptape_nodes_library"
"libraries.griptape_nodes_library".msg = "Import from griptape_nodes_library instead of libraries.griptape_nodes_library"
"libraries.griptape_nodes_advanced_media_library".msg = "Import from griptape_nodes_advanced_media_library instead of libraries.griptape_nodes_advanced_media_library"
"libraries.griptape_cloud".msg = "Import from griptape_cloud instead of libraries.griptape_cloud"
"griptape_nodes.retained_mode.griptape_nodes.GriptapeNodes".msg = "Engine-internal code should take an injected Engine (see griptape_nodes.retained_mode.engine) and reach peers via self.engine, not the process-wide GriptapeNodes facade. The facade exists for saved workflow files, node libraries, and process entry points; those are allowlisted in per-file-ignores."

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D104", "TID251"]
"libraries/**/tests/**" = ["S101", "D104", "INP001"]
"src/griptape_nodes/retained_mode/events/*" = ["TC001"]
# Example libraries shipped with the Advanced Libraries doc. Authors copy these files
# verbatim, so the exemptions live here rather than as noqa noise in the examples.
# INP001: a docs folder is not an importable package.
# N807: the dunder-named locals are the point -- module-level `__getattr__` is PEP 562,
# and the `__init__` built inside the class factory has to be named `__init__`.
# TID251: node libraries are the intended audience for the GriptapeNodes facade, as the
# ban message itself says.
"docs/development/custom_nodes/example_dynamic_library/**" = ["INP001", "N807"]
"docs/development/custom_nodes/example_request_handler_library/**" = ["INP001", "TID251"]

# TID251 allowlist for the GriptapeNodes facade. Two groups, and the difference matters.
#
# Group 1 -- legitimate facade users. These are process entry points or the public
# surface that separately-versioned callers bind to, so they have no Engine to be handed.
"src/griptape_nodes/retained_mode/griptape_nodes.py" = ["TID251"]
"src/griptape_nodes/retained_mode/retained_mode.py" = ["TID251"]
"src/griptape_nodes/cli/**" = ["TID251"]
"src/griptape_nodes/api_client/**" = ["TID251"]
"src/griptape_nodes/servers/**" = ["TID251"]
"src/griptape_nodes/bootstrap/**" = ["TID251"]
"src/griptape_nodes/app/**" = ["TID251"]
# WorkflowPackager is constructed by node libraries, not by the engine: the standard library's
# publish_workflow/local_publisher.py does `WorkflowPackager(workflow_name)` off the public
# `retained_mode.publishing` re-export. Nothing inside src/ constructs it, so there is no Engine
# to hand it and it belongs on this side of the split.
"src/griptape_nodes/retained_mode/publishing/workflow_packager.py" = ["TID251"]
#
# Group 2 -- not yet migrated. Each of these should eventually receive an Engine instead.
# Deleting an entry from this list is the definition of done; do not add new entries.
# scan.py reaches the facade from a module-level free function, so its engine has to be threaded
# from os_manager.on_scan_sequences_request down through scan_sequences. It moves with the other
# free-function modules rather than with the class-based execution internals.
"src/griptape_nodes/common/sequences/scan.py" = ["TID251"]
# GriptapeCloudStorageDriver is constructed from inside exe_types
# (param_components/artifact_url/public_artifact_url_parameter.py), which has no Engine of its own
# yet, so drivers cannot come off this list until exe_types does.
"src/griptape_nodes/drivers/**" = ["TID251"]
"src/griptape_nodes/exe_types/**" = ["TID251"]
"src/griptape_nodes/files/**" = ["TID251"]
# WorkflowRegistry is still a process-global fake singleton reaching the facade for config.
# Making it engine-owned is its own change, since it alters what node libraries import.
"src/griptape_nodes/node_library/workflow_registry.py" = ["TID251"]
"src/griptape_nodes/utils/**" = ["TID251"]
"src/griptape_nodes/retained_mode/file_metadata/**" = ["TID251"]
# project_packager.py reaches the facade from a module-level free function. Its engine has to be
# threaded from project_manager.on_export_project_request through package_project_to_zip.
"src/griptape_nodes/retained_mode/publishing/project_packager.py" = ["TID251"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.typos]
files.extend-exclude = ["libraries/**/templates/*"]
default.extend-ignore-re = [
  # Ignore any line that ends with this comment:
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
  # Or: ignore the *next* line after this comment:
  "(?m)(#|//)\\s*spellchecker:ignore-next-line\\n.*",
]

[tool.typos.default.extend-words]
# HALD CLUT is a Color Lookup Table technique named after its inventor
HALD = "HALD"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [
  "libraries/**/templates/*",
  # Engine-generated workflow files. The generator emits untyped request/result chains, so these are
  # checked by running them, not by pyright.
  "tests/e2e/fixtures/**/*_workflow.py",
  ".venv",
  "GriptapeNodes",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
