name: "Init Environment"
description: "Initialize environment for workflows"
runs:
  using: "composite"
  steps:
    - name: Checkout actions
      uses: actions/checkout@v4

    - id: setup-python
      name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # uv prefers .python-version over the interpreter setup-python put on PATH, so a matrix
    # version only takes effect through UV_PYTHON. Exported to GITHUB_ENV so later `uv run` steps
    # keep using it instead of rebuilding the venv on the pinned version.
    - name: Pin uv to the matrix Python version
      if: matrix.python-version != ''
      shell: bash
      run: echo "UV_PYTHON=${{ matrix.python-version }}" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: uv sync --all-extras --all-groups
